name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cooper-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.9.18

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Check backend lockfile and dependencies
        run: uv lock --check && uv pip check

      - name: Run backend tests
        run: uv run pytest

      - name: Check backend formatting and lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --no-file-parallelism
        working-directory: frontend

      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Store hosting bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-hosting:
    name: Deploy Firebase Hosting
    needs: verify
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore hosting bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Check Firebase deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRYTHECOOPER || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_TRYTHECOOPER or FIREBASE_SERVICE_ACCOUNT in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Deploy live Firebase Hosting site
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRYTHECOOPER || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: trythecooper
          channelId: live

  trigger-render:
    name: Trigger Render API deploy (optional)
    needs: verify
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      # A step's own `env:` block is invisible to that step's `if:` condition, so the secret has
      # to be lifted to job scope for both steps below to be able to branch on it.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deploy hook when configured
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Use Render Git auto-deploy when no hook is configured
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        run: echo "Render deploy hook is not configured; enable Auto-Deploy in the Render service."
