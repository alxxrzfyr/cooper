name: Verify and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.9.18

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run pytest

      - name: Check backend formatting and lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --no-file-parallelism
        working-directory: frontend

      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Store hosting bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-hosting:
    name: Deploy Firebase Hosting
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore hosting bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Check Firebase deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRYTHECOOPER || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_TRYTHECOOPER or FIREBASE_SERVICE_ACCOUNT in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Deploy live Firebase Hosting site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRYTHECOOPER || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: trythecooper
          channelId: live

  trigger-render:
    name: Trigger Render API deploy (optional)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook when configured
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Use Render Git auto-deploy when no hook is configured
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: echo "Render deploy hook is not configured; enable Auto-Deploy in the Render service."
