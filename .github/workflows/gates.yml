name: gates

# Runs the four backend gates plus the frontend suite and build. PRD Phase 0 acceptance 5
# requires the import-linter contract to run in CI, so a core-purity violation fails here
# rather than being noticed in review.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate a throwaway database
        run: uv run alembic upgrade head
        env:
          CADENCE_SHARED_SECRET: ci-shared-secret-value-0123456789abcdef
          CADENCE_DATABASE_URL: sqlite:///./ci.db
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy cadence
      - name: Layer purity contract
        run: uv run lint-imports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
